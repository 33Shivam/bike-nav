; BikeNav - ESP32-S3 hardware bring-up
; Board: Waveshare ESP32-S3-LCD-1.28 (Non-Touch)
; MCU:   ESP32-S3R2 (16MB external QIO flash, 2MB QSPI PSRAM)
; Verified against official Waveshare docs: https://www.waveshare.com/wiki/ESP32-S3-LCD-1.28
;
; No PlatformIO board JSON exists for this specific Waveshare variant, so we
; start from the generic esp32-s3-devkitc-1 board and override flash/PSRAM to
; match the actual ESP32-S3R2 module on this board.

[env:esp32-s3-lcd-1_28]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM: must match ESP32-S3R2 (16MB QIO flash, 2MB QSPI PSRAM) ---
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.extra_flags =
    -DBOARD_HAS_PSRAM

; --- Serial / upload ---
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

; --- Display + BLE companion libraries ---
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    fbiego/ChronosESP32@^1.9.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; 0 = live ChronosESP32 BLE integration (default), 1 = mock demo mode
    ; from Milestone 2, no BLE. Flip to 1 for UI-only development.
    -DBIKENAV_MOCK_MODE=0


